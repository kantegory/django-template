services:
    db:
        image: postgres:17
        container_name: example_db
        env_file:
            - ./django_core/.env

        expose:
            - 5432

        volumes:
            - ./dbs/postgres-data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis
        container_name: example_redis

        restart: always

        expose:
            - 6379

        volumes:
            - ./dbs/redis-data:/data/

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    backend:
        image: template_django_core
        container_name: template_django_core
        build: ./django_core
        env_file:
            - ./django_core/.env

        command: gunicorn -w 3 django_core.wsgi:application --bind 0.0.0.0:8000 --reload

        restart: always

        expose:
            - 8000

        volumes:
            - ./django_core:/var/www/apps/django_core

        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    dramatiq:
        image: template_django_core
        container_name: template_dramatiq
        env_file:
            - ./django_core/.env

        command: python manage.py rundramatiq

        restart: always

        volumes:
            - ./django_core:/var/www/apps/django_core

        depends_on:
            redis:
                condition: service_healthy
            backend:
                condition: service_started

    nginx:
        build: ./nginx

        restart: always

        ports:
            - 3337:80

        env_file:
            - ./nginx/.env

        volumes:
            - ./django_core/media:/var/www/media
            - ./django_core/static:/var/www/static

        depends_on:
            - backend
